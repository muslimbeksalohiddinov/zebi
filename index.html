<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kecha va Kunduz — Videoni ko'rish</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #070913;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Start Screen with Ambient Background */
        #start-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, #1f2547 0%, #0d1124 45%, #060710 100%);
            z-index: 20;
            padding: 24px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #start-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Decorative glowing orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            pointer-events: none;
            animation: floatOrb 10s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: #e94560;
            top: -80px;
            right: -60px;
        }

        .orb-2 {
            width: 380px;
            height: 380px;
            background: #3a506b;
            bottom: -120px;
            left: -80px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-25px, 25px) scale(1.12); }
        }

        /* Glassmorphism Cinema Card */
        .card {
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(233, 69, 96, 0.16);
            color: #ff6b81;
            border: 1px solid rgba(233, 69, 96, 0.35);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e94560;
            box-shadow: 0 0 8px #e94560;
        }

        h1 {
            color: #ffffff;
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 12px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.72);
            font-size: 15px;
            line-height: 1.55;
            margin-bottom: 30px;
        }

        /* Progress info when paused */
        #resume-info {
            display: none;
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff758f);
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
        }

        .play-btn {
            width: 100%;
            background: linear-gradient(135deg, #e94560 0%, #c81d45 100%);
            color: white;
            border: none;
            padding: 17px 36px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .play-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 30px rgba(233, 69, 96, 0.65);
            filter: brightness(1.06);
        }

        .play-btn:active {
            transform: scale(0.97);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 15px solid white;
            margin-left: 3px;
        }

        .restart-btn {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 13px 28px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .restart-btn:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .hints {
            margin-top: 26px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
        }

        .hint-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Video Player Container */
        #video-container {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 10;
        }

        #video-container.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        /* Top bar inside video player */
        .player-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #video-container:hover .player-topbar,
        #video-container.show-ui .player-topbar {
            opacity: 1;
            pointer-events: auto;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(233, 69, 96, 0.8);
            border-color: transparent;
        }

        /* Loading Spinner */
        #loader {
            display: none;
            position: absolute;
            width: 54px;
            height: 54px;
            border: 4px solid rgba(255, 255, 255, 0.18);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
            z-index: 16;
            pointer-events: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="card">
            <div class="badge">
                <span class="badge-dot"></span>
                HD Video Namoyish
            </div>

            <h1 id="main-title">Kecha va Kunduz</h1>
            <p class="subtitle" id="sub-title">
                Videoni to'liq ekranda va yuqori ovoz sifatida tomosha qilish uchun quyidagi tugmani bosing
            </p>

            <div id="resume-info">
                <span id="resume-text">To'xtagan joy: 00:00</span>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="play-btn" id="playBtn">
                    <div class="play-icon"></div>
                    <span id="playBtnText">Boshlash</span>
                </button>

                <button class="restart-btn" id="restartBtn">
                    Boshidan ko'rish
                </button>
            </div>

            <div class="hints">
                <span class="hint-item">🔊 Maksimal ovoz</span>
                <span class="hint-item">⛶ To'liq ekran</span>
                <span class="hint-item">📱 Mobil moslashgan</span>
            </div>
        </div>
    </div>

    <div id="video-container">
        <div class="player-topbar">
            <button class="back-btn" id="backBtn">← Orqaga</button>
        </div>

        <div id="loader"></div>

        <video id="myVideo" controls playsinline preload="metadata">
            <source src="Kecha_va_Kunduz_51_boshlanish_birlashtirilgan.mp4" type="video/mp4">
            Brauzeringiz videoni qo'llab-quvvatlamaydi.
        </video>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const playBtnText = document.getElementById('playBtnText');
        const restartBtn = document.getElementById('restartBtn');
        const backBtn = document.getElementById('backBtn');
        const startScreen = document.getElementById('start-screen');
        const videoContainer = document.getElementById('video-container');
        const video = document.getElementById('myVideo');
        const loader = document.getElementById('loader');
        const resumeInfo = document.getElementById('resume-info');
        const resumeText = document.getElementById('resume-text');
        const progressFill = document.getElementById('progress-fill');
        const subTitle = document.getElementById('sub-title');

        let uiTimeout = null;

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '00:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function enterFullscreen() {
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen().catch(() => {});
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen();
            } else if (video.webkitEnterFullscreen) {
                // iOS Safari native fullscreen support
                video.webkitEnterFullscreen();
            } else if (videoContainer.msRequestFullscreen) {
                videoContainer.msRequestFullscreen();
            }
        }

        function exitFullscreenIfActive() {
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        function startPlayback(fromBeginning = false) {
            if (fromBeginning) {
                video.currentTime = 0;
            }

            startScreen.classList.add('hidden');
            videoContainer.classList.add('active');
            video.volume = 1.0;
            video.muted = false;

            enterFullscreen();

            video.play().catch(error => {
                console.error('Video play failed:', error);
            });
        }

        function showStartScreen() {
            video.pause();
            videoContainer.classList.remove('active');
            startScreen.classList.remove('hidden');

            if (video.currentTime > 2 && video.duration && video.currentTime < video.duration - 2) {
                const percent = Math.min(100, Math.round((video.currentTime / video.duration) * 100));
                resumeInfo.style.display = 'block';
                resumeText.textContent = `To'xtagan joy: ${formatTime(video.currentTime)} / ${formatTime(video.duration)} (${percent}%)`;
                progressFill.style.width = percent + '%';
                playBtnText.textContent = 'Davom ettirish';
                restartBtn.style.display = 'block';
                subTitle.textContent = 'Videoni to\'xtagan joyidan davom ettirishingiz yoki boshidan ko\'rishingiz mumkin';
            } else {
                resumeInfo.style.display = 'none';
                playBtnText.textContent = 'Boshlash';
                restartBtn.style.display = 'none';
            }
        }

        playBtn.addEventListener('click', () => startPlayback(false));
        restartBtn.addEventListener('click', () => startPlayback(true));

        backBtn.addEventListener('click', () => {
            exitFullscreenIfActive();
            showStartScreen();
        });

        // Show/hide loading indicator
        video.addEventListener('waiting', () => {
            loader.style.display = 'block';
        });
        video.addEventListener('playing', () => {
            loader.style.display = 'none';
        });
        video.addEventListener('canplay', () => {
            loader.style.display = 'none';
        });

        // When video finishes
        video.addEventListener('ended', () => {
            exitFullscreenIfActive();
            video.currentTime = 0;
            resumeInfo.style.display = 'none';
            restartBtn.style.display = 'none';
            playBtnText.textContent = 'Qayta ko\'rish';
            subTitle.textContent = 'Video yakunlandi. Yana tomosha qilish uchun tugmani bosing';
            videoContainer.classList.remove('active');
            startScreen.classList.remove('hidden');
        });

        // Handle exiting fullscreen on desktop/Android
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && videoContainer.classList.contains('active')) {
                showStartScreen();
            }
        });

        // Handle exiting fullscreen on iOS Safari
        video.addEventListener('webkitendfullscreen', () => {
            showStartScreen();
        });

        // Show topbar briefly on touch/mouse move
        function triggerTopbar() {
            videoContainer.classList.add('show-ui');
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => {
                videoContainer.classList.remove('show-ui');
            }, 2800);
        }

        videoContainer.addEventListener('mousemove', triggerTopbar);
        videoContainer.addEventListener('touchstart', triggerTopbar, { passive: true });

        // Keyboard shortcuts while player is active
        document.addEventListener('keydown', (e) => {
            if (!videoContainer.classList.contains('active')) return;

            if (e.code === 'Space') {
                e.preventDefault();
                if (video.paused) video.play();
                else video.pause();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                video.currentTime = Math.max(0, video.currentTime - 10);
            } else if (e.code === 'KeyM') {
                video.muted = !video.muted;
            } else if (e.code === 'Escape') {
                showStartScreen();
            }
        });
    </script>
</body>
</html>
